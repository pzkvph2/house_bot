services:
  - type: web
    name: edtech-arbitrage-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
